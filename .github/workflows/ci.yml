name: CI
on:
  push:
    branches-ignore: [main]   # main is tested by image.yml before publishing
  pull_request:
  workflow_call:
permissions:
  contents: read
  packages: read   # k6labs.Hathor from GitHub Packages
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NuGetPackageSourceCredentials_k6labs: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Anubis.slnx
      - run: dotnet build Anubis.slnx -c Release --no-restore
      - run: dotnet test Anubis.slnx -c Release --no-build
