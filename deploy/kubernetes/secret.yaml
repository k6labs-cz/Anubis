# PLACEHOLDER VALUES — replace before applying (or manage this Secret with
# External Secrets / Sealed Secrets instead of committing it).
#
# Mounted as /run/secrets/anubis (Anubis__SecretsDirectory): one file per key,
# "__" separates configuration sections, e.g. the file "Email__Smtp__Password"
# sets Email:Smtp:Password.
apiVersion: v1
kind: Secret
metadata:
  name: anubis-secrets
type: Opaque
stringData:
  Anubis__AdminPassword: "change-me-please-123"
  Email__Smtp__Password: "smtp-password"
