# Cluster-internal only: other microservices in the cluster reach Anubis here
# (OIDC endpoints, /api SCIM provisioning); the outside world goes through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: anubis
spec:
  type: ClusterIP
  selector: { app: anubis }
  ports:
    - name: http
      port: 80
      targetPort: http
